name: PomodoroFocus
options:
  bundleIdPrefix: com.leicheng9
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  PomodoroFocus:
    type: application
    platform: iOS
    sources:
      - path: Sources/PomodoroFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leicheng9.PomodoroFocus
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "专注完成时发送通知提醒"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"

  PomodoroFocusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/PomodoroFocusTests
    dependencies:
      - target: PomodoroFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leicheng9.PomodoroFocusTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

  PomodoroFocusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Sources/PomodoroFocusUITests
    dependencies:
      - target: PomodoroFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leicheng9.PomodoroFocusUITests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: ""
        TEST_HOST: ""
        SWIFT_VERSION: "6.0"

name: PomodoroFocus
options:
  bundleIdPrefix: com.leicheng9
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PomodoroFocus:
    type: application
    platform: iOS
    sources:
      - Sources/PomodoroFocus
    resources:
      - path: Sources/PomodoroFocus/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leicheng9.PomodoroFocus
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        PRIVACY_MANIFEST: Sources/PomodoroFocus/PrivacyInfo.xcprivacy

  PomodoroFocusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Sources/PomodoroFocusTests
    dependencies:
      - target: PomodoroFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leicheng9.PomodoroFocusTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

  PomodoroFocusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Sources/PomodoroFocusUITests
    dependencies:
      - target: PomodoroFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leicheng9.PomodoroFocusUITests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: ""
        TEST_HOST: ""
        SWIFT_VERSION: "6.0"
